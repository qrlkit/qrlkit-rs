name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - run: python3 scripts/test-terminal.py
      - run: python3 scripts/test-install.py
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node --check npm/bin/qrlkit.cjs
