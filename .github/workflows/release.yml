name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Check tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -er '.packages[0].version')
          test "$TAG" = "v$VERSION"

      - name: Publish to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Install musl target
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Build Linux x86_64 binary
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Package binary
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          DIRECTORY="qrlkit-${VERSION}-linux-x86_64"
          ARCHIVE="${DIRECTORY}.tar.gz"

          mkdir "$DIRECTORY"
          cp target/x86_64-unknown-linux-musl/release/qrlkit "$DIRECTORY/"
          cp LICENSE README.md "$DIRECTORY/"
          tar -czf "$ARCHIVE" "$DIRECTORY"
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            qrlkit-*.tar.gz \
            qrlkit-*.tar.gz.sha256 \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
