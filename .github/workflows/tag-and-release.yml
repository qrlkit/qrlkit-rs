name: Tag merged version

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: write

jobs:
  tag:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.version.outputs.before != steps.version.outputs.after }}
      tag: v${{ steps.version.outputs.after }}

    steps:
      - name: Check out merged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Read package versions
        id: version
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          git switch --detach "$BASE_SHA"
          BEFORE=$(cargo metadata --no-deps --format-version 1 | jq -er '.packages[0].version')
          git switch --detach "$MERGE_SHA"
          AFTER=$(cargo metadata --no-deps --format-version 1 | jq -er '.packages[0].version')
          echo "before=$BEFORE" >> "$GITHUB_OUTPUT"
          echo "after=$AFTER" >> "$GITHUB_OUTPUT"

      - name: Push version tag
        if: steps.version.outputs.before != steps.version.outputs.after
        env:
          TAG: v${{ steps.version.outputs.after }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          if EXISTING=$(git rev-parse --verify "refs/tags/$TAG^{commit}" 2>/dev/null); then
            if [ "$EXISTING" != "$MERGE_SHA" ]; then
              echo "Tag $TAG already points to another commit."
              exit 1
            fi
          else
            git tag "$TAG" "$MERGE_SHA"
          fi
          git push origin "refs/tags/$TAG"

  publish:
    needs: tag
    if: needs.tag.outputs.changed == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.tag }}
          persist-credentials: false

      - name: Check tag matches package version
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -er '.packages[0].version')
          test "$TAG" = "v$VERSION"

      - name: Publish to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Install musl target
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Build Linux x86_64 binary
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Package binary
        env:
          VERSION: ${{ needs.tag.outputs.tag }}
        run: |
          VERSION="${VERSION#v}"
          DIRECTORY="qrlkit-${VERSION}-linux-x86_64"
          ARCHIVE="${DIRECTORY}.tar.gz"

          mkdir "$DIRECTORY"
          cp target/x86_64-unknown-linux-musl/release/qrlkit "$DIRECTORY/"
          cp LICENSE README.md "$DIRECTORY/"
          tar -czf "$ARCHIVE" "$DIRECTORY"
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          gh release create "$TAG" \
            qrlkit-*.tar.gz \
            qrlkit-*.tar.gz.sha256 \
            --title "$TAG" \
            --generate-notes
