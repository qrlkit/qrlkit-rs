name: Tag merged version

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read

jobs:
  tag:
    permissions:
      contents: write
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.version.outputs.before != steps.version.outputs.after }}
      tag: v${{ steps.version.outputs.after }}

    steps:
      - name: Check out merged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Read package versions
        id: version
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          git switch --detach "$BASE_SHA"
          BEFORE=$(cargo metadata --no-deps --format-version 1 | jq -er '.packages[0].version')
          git switch --detach "$MERGE_SHA"
          AFTER=$(cargo metadata --no-deps --format-version 1 | jq -er '.packages[0].version')
          echo "before=$BEFORE" >> "$GITHUB_OUTPUT"
          echo "after=$AFTER" >> "$GITHUB_OUTPUT"

      - name: Push version tag
        if: steps.version.outputs.before != steps.version.outputs.after
        env:
          TAG: v${{ steps.version.outputs.after }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          if EXISTING=$(git rev-parse --verify "refs/tags/$TAG^{commit}" 2>/dev/null); then
            if [ "$EXISTING" != "$MERGE_SHA" ]; then
              echo "Tag $TAG already points to another commit."
              exit 1
            fi
          else
            git tag "$TAG" "$MERGE_SHA"
          fi
          git push origin "refs/tags/$TAG"

  build:
    needs: tag
    if: needs.tag.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            platform: linux-x64
            archive: linux-x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            platform: linux-arm64
            archive: linux-aarch64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: darwin-x64
            archive: macos-x86_64
          - runner: macos-15
            target: aarch64-apple-darwin
            platform: darwin-arm64
            archive: macos-aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.tag }}
          persist-credentials: false

      - name: Check tag matches package version
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -er '.packages[0].version')
          test "$TAG" = "v$VERSION"

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install target
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"

      - name: Install musl tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Build and test native binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo build --release --locked --target "$TARGET"
          node npm/test.cjs "target/$TARGET/release/qrlkit"

      - name: Package npm binaries and launcher
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p dist
          node npm/package.cjs "$TARGET" "target/$TARGET/release/qrlkit" staging
          npm pack "./staging/qrlkit-$PLATFORM" --pack-destination dist
          if [ "$PLATFORM" = linux-x64 ]; then
            npm pack ./staging/qrlkit --pack-destination dist
          fi

      - name: Package binary
        env:
          VERSION: ${{ needs.tag.outputs.tag }}
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.archive }}
        run: |
          VERSION="${VERSION#v}"
          DIRECTORY="qrlkit-${VERSION}-${PLATFORM}"
          ARCHIVE="${DIRECTORY}.tar.gz"

          mkdir "$DIRECTORY"
          cp "target/$TARGET/release/qrlkit" "$DIRECTORY/"
          cp LICENSE README.md "$DIRECTORY/"
          tar -czf "dist/$ARCHIVE" "$DIRECTORY"
          cd dist
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [tag, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.tag }}
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11

      - name: Publish to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # Configure this workflow as a trusted publisher on each of the five npm packages.
      - name: Publish platform packages, then launcher using OIDC
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          for PLATFORM in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            npm publish "dist/qrlkit-$PLATFORM-$VERSION.tgz" --access public --provenance
          done
          npm publish "dist/qrlkit-$VERSION.tgz" --access public --provenance

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          gh release create "$TAG" \
            dist/qrlkit-*.tar.gz \
            dist/qrlkit-*.tar.gz.sha256 \
            --title "$TAG" \
            --generate-notes
