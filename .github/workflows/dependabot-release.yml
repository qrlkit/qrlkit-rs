name: Prepare release PR after Dependabot merge

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-release-${{ github.event.repository.default_branch }}
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_BRANCH: dependabot-release-${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: true

      - name: Create release branch
        run: |
          git switch -c "$RELEASE_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email ""

      - name: Install cargo-edit
        run: cargo install cargo-edit --locked

      - name: Install qrlkit
        run: cargo install --path . --locked

      - name: Import repository QRLs
        env:
          QRL_STATE: ${{ runner.temp }}/qrlkit-state.yaml
        run: qrlkit --config "$QRL_STATE" add QRLs.toml

      - name: Prepare release
        env:
          QRL_STATE: ${{ runner.temp }}/qrlkit-state.yaml
        run: qrlkit --config "$QRL_STATE" qk prep-release patch "Bump dependencies"

      # The tag-release workflow creates the version tag after this PR is merged.
      - name: Push release branch
        run: |
          if git ls-remote --exit-code --heads origin "$RELEASE_BRANCH" >/dev/null 2>&1; then
            echo "Release branch $RELEASE_BRANCH already exists; reusing it."
          else
            git -c push.followTags=false push origin "HEAD:refs/heads/$RELEASE_BRANCH"
          fi

      - name: Open release PR
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          DEPENDABOT_PR: ${{ github.event.pull_request.number }}
        run: |
          if gh pr list \
            --base "$BASE_BRANCH" \
            --head "$RELEASE_BRANCH" \
            --state all \
            --json number \
            --jq 'length > 0' | grep -q true; then
            echo "Release PR for $RELEASE_BRANCH already exists; nothing to do."
            exit 0
          fi

          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$RELEASE_BRANCH" \
            --title "$(git log -1 --format=%s)" \
            --body "Prepare a patch release after Dependabot PR #$DEPENDABOT_PR. Generated by qrlkit qk prep-release: bumps Cargo.toml and Cargo.lock and updates CHANGELOG.md with Bump dependencies."
