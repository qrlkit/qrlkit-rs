[package]
name = "qrlkit"
version = "0.4.0"
edition = "2024"
description = "Quick Resource Locator: open named URLs from imported TOML files"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "7"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10"
tempfile = "3"
toml = "1.1"
url = "2"
