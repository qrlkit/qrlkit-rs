# qrlkit add examples/syntax.yaml

# Open a URL
web:
  docs: https://docs.rs/ratatui/latest/ratatui/
# Relative to your shell: change directory or print a file path
paths:
  repo: ./
  # Absolute path
  project: /home/bob/work/project
  readme: ./README.md
scripts:
