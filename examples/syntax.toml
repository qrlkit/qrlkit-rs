# qrlkit add examples/syntax.toml

# Open a URL
[web]
docs = "https://docs.rs/ratatui/latest/ratatui/"

# Relative to your shell: change directory or print a file path
[paths]
repo = "./"
# Absolute path (Windows: C:\work\project)
project = "/home/alex/work/project"
readme = "./README.md"

# qrlkit scripts greet "friend"
[scripts.greet]
"$run" = '''
printf 'Hello, %s!\n' "$1"
printf 'From %s\n' "$PWD"
'''
"$shell" = "bash"

# qrlkit scripts greet-windows "friend"
[scripts.greet-windows]
"$run" = '''
Write-Output "Hello, $($args[0])!"
Write-Output "From $PWD"
'''
"$shell" = "pwsh"
